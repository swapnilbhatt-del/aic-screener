# Single source of rubric configuration. Loaded by aic/config.py.
# Origin: reference/AIC_Rubric_v1.md (DRAFT, not yet agreed with Kushal) plus user defaults of 2026-11-19.
# Do not edit weights or thresholds without partner approval (see CLAUDE.md).

version: "v1-draft"

score_scale: {min: 0, max: 5}
anchors:
  5: "evidenced, specific, internally consistent, and checkable from an outside source"
  3: "specific and plausible, but unverified or partly consistent"
  1: "claimed without evidence, or contradicted by another part of the file"
  0: "missing (marked unknown; never skipped or imputed)"

groups:
  founder: [F1, F2, F3, F4]
  path: [T1, T2, T3]
  thesis: [M1, M2, M3]
  structure: [S1, S2]

criteria:
  F1: {name: "Earned depth in this problem", weight: 10}
  F2: {name: "Owns the hardest risk", weight: 10}
  F3: {name: "Candour and specificity", weight: 10}
  F4: {name: "Team completeness", weight: 5}
  T1: {name: "Traction quality", weight: 15}
  T2:
    name: "Unit economics and retention disclosed"
    weight: 15
    # Each sub-part is worth 1 point on the 0-5 scale; a missing sub-part scores 0.
    subparts: [repeat_or_cohort, cac_by_channel, gross_margin, payback, ltv_cac]
  T3: {name: "Path to revenue and milestones", weight: 5}
  M1: {name: "Market evidence reconciles", weight: 5}
  M2: {name: "Defensibility and honest competition", weight: 10}
  M3: {name: "Thesis fit and why now", weight: 5}
  S1: {name: "Capital structure fits the cheque", weight: 5}
  S2: {name: "Evidence integrity", weight: 5}

thresholds:
  call: 70          # >= call -> Call band (from the brief)
  pass: 55          # <  pass -> Pass recommendation
  close_call_margin: 5
  close_call_inclusive: true

pedigree_cap:
  criterion: F1
  max_score: 2
  unless_any_of: [F2, F3]
  unless_min_score: 3

integrity_cap:
  # Only contradictions between sources trigger the cap; internal arithmetic errors are reported, not capped.
  trigger: cross_source_contradiction
  sources: [deck, form, public_record]
  material_fields: [traction, revenue, team, credentials, raise, credit_structure]   # credit_structure added by user 2026-11-19
  max_band: partner_review   # can only lower a band, never raise one

# User decisions 2026-11-19 (Stage 3 checkpoint)
founder_evidence_cap:
  criteria: [F1, F2, F3, F4]
  max_without_external_support: 4   # anchor 5 needs evidence checkable from an outside source
public_record_contradictions:
  feeds: [M1, M2]                   # do not trigger the integrity cap
public_sectors: [fintech, deeptech, consumer tech, consumer brands]   # G2(c) uses the public line (rubric section 7)
pre_seed_stages: [pre-seed, seed]                                     # G3

# T2 sub-part rules applied in code for consistency across scorers.
# Literal reading of "CAC by channel" (confirmed by user 2026-11-19).
t2_rules:
  cac_by_channel_min_channels: 2   # present only if CAC figures are disclosed for >= 2 named channels

# Rubric anchors enforced in code (a model score that breaks them is rejected, not silently changed)
anchor_rules:
  S2_max_if_material_contradiction: 1
  M1_max_if_market_or_assumption_check_fails: 1

flag_at_call_band: partner_review   # score >= call with any open gate Flag
flag_below_pass: pass   # user 2026-11-19: a flagged company below the pass threshold stays 'pass', flag shown; partner decides

arithmetic:
  tolerance: 0.05
  check_kinds: [formula, cross_document, assumption_vs_observed]

gates:
  G1: {name: "Conflict with portfolio", on_hit: hold, hold_on_strength: [direct]}   # user 2026-11-19: adjacent overlaps shown, not held
  G2: {name: "Category or structure", on_hit: flag}
  G3: {name: "Stage", on_hit: flag}
  G4: {name: "Commitment", on_hit: flag}
  G5: {name: "Regulated-lending exposure without credit owner", on_hit: flag}

bands:
  - {id: hold, label: "Hold", system_may: "Hold and the reason", human: "Kushal resolves the conflict first"}
  - {id: call, label: "Call", system_may: "Move to call", human: "Kushal sees outcome before any email; Riya reviews draft"}
  - {id: partner_review, label: "Partner review", system_may: "Review with 2-3 gaps", human: "Partner decides; no email by default"}
  - {id: pass, label: "Pass recommendation", system_may: "Pass with draft note", human: "Partner decides; nothing auto-rejected"}

feedback:
  min_similar_corrections: 3     # from the brief: propose a weight change only after 3+ similar corrections
  similar_means: same criterion, same direction, distinct companies
  proposal_step: 5               # largest candidate weight move; shrinks (2, then 1) if it would zero a weight. A proposal, never applied
  proposal_offset: largest other criterion in the same group   # keeps group subtotals and the 100 total
  # Feedback into the scoring prompt (user 2026-11-24, lecture 24 Nov): only lessons that 2+ other companies in the
  # same sector agree on (same criterion, same direction), scope 'general', not flagged as a bad day or retracted.
  inject_min_agreeing_companies: 2
  inject_max_lessons: 5

learning:
  # Disagreement score: the gap between what the system recommended and what Riya/the partners did.
  plateau_months: 3              # a signal has plateaued if its monthly rate moved less than plateau_band over this many months
  plateau_band: 0.05

finetune:
  # PROPOSED bar for "consider fine-tuning" (user 2026-11-24: a proposal for Kushal to set, like oos_test).
  bar: {disagreement_above: 0.30, sustained_months: 3, min_pairs: 200, repeat_mistake: 5}
  split: {train: 0.75, val: 0.15, test: 0.10}     # lecture 24 Nov
  max_sector_share: 0.40         # PROPOSED: no sector above 40% of the dataset (lecture: don't over-index on one industry)
  route: self-managed            # lecture: Unsloth/Colab; founder data stays in-house. Base: a 2-8B Gemma, Qwen or Llama
  # Per-criterion pairs (user 2026-11-24): one criterion per example, so it fits a small GPU. Each criterion sees a
  # FIXED slice of the inputs (written here, not chosen by a model). Claim metrics match by prefix ("founder_" covers
  # founder_name, founder_role...); "*" means every claim. All checks go to every criterion (they are short).
  criterion_inputs:
    F1: {claims: [founder_, team_size, time_commitment], research: [founder], form: [founders]}
    F2: {claims: [founder_, key_risk, dependency, regulatory_dependency, product_claim], research: [founder, company], form: [founders]}
    F3: {claims: ["*"], research: []}
    F4: {claims: [founder_, team_size, use_of_funds_pct, key_risk], research: [founder], form: [founders]}
    T1: {claims: [customers_, mrr_inr, arr_inr, revenue_cumulative_inr, time_series, seats_paid, units_live, pilot_to_paid_pct, arpu_month_inr, evidence_of_value], research: [company]}
    T2: {claims: [cac_inr, channel_mix_pct, gross_margin_pct, payback_months, customers_, arpu_month_inr, price_inr, time_series], research: []}
    T3: {claims: [milestone_target, use_of_funds_pct, price_inr, mrr_inr, arr_inr, time_series, regulatory_dependency], research: [regulatory]}
    M1: {claims: [market_, price_inr, arpu_month_inr, customers_], research: [market]}
    M2: {claims: [competitor_named, competition_claim, market_share_claim, product_claim], research: [competitor]}
    M3: {claims: [sector, stage, product_claim, regulatory_dependency], research: [market, regulatory, thesis], fund: [thesis], form: [fields]}
    S1: {claims: [raise_inr, valuation_post_inr, existing_investment_inr, other_investors, use_of_funds_pct, stage, incorporated], research: [], form: [fields]}
    S2: {claims: ["*"], research: [company, founder]}

oos_test:
  # PROPOSED bar for trusting the band (Trust & limits page); Kushal to agree or change.
  min_agree: 8
  of: 10
  call_scored_pass_allowed: 0     # no application the partners call may be scored 'pass'
  agreement:                      # partner decision -> model bands that count as agreeing
    call: [call]
    pass: [pass, hold]
    hold: [hold]
  no_commitment: [partner_review]  # model band that neither agrees nor disagrees
  excluded_decisions: [review_more]

routing:
  deeptech_second_call: Aditya
  first_screen_fintech_consumer: Riya
  outcome_gate: Kushal

outreach:
  dry_run: true
  slot_days: [Tuesday, Thursday]
  slot_window: {start: "14:00", end: "18:00", tz: "Asia/Kolkata"}
  slot_minutes: 30
  slot_lead: next_business_day   # user 2026-11-19: never offer a same-day slot
  holds_per_invite: 3            # user 2026-11-19: each invite tentatively holds all proposed slots (each needs approval)
  follow_up_after_days: 3
  max_follow_ups: 3              # user 2026-11-20 (lecture, 19 Nov): up to 3; then a partner decides (no auto-reject)
  after_last_follow_up: partner_decides
  deeptech_first_call_attendees: [Riya, Kushal]   # lecture 19 Nov: Kushal joins the first call only for deeptech
  first_call_attendees: [Riya]
  calendar_mode: ics_only
  # Recipients are held in the DB table allowed_recipients (empty by default), not here.

# ---- AI cost tracking, guardrails and ROI (user 2026-11-20, from the 19 Nov lecture) ----
ai:
  # Every model call goes through aic/llm.py: metered into ai_calls, cached, and stopped by the kill switch.
  models:                 # per task; change only after `python -m aic.runner compare` shows a cheaper model holds quality
    # user 2026-11-21: run on Gemini (key the user already has). gemini-4-carbon = Google's "most capable reasoning
    # model"; it has no "Stable" badge on the models page (2026-11-21). Claude models stay priced for `compare`.
    # 2026-11-24 (user): use the Gemini key (free tier). On it, Google Search is refused (429) and calls get 503
    # "high demand" intermittently, even one-line ones (1 in 3 in a test); larger calls fail more often.
    extraction: gemini-3.5-flash-lite
    research: gemini-3.5-flash-lite
    scoring: gemini-3.5-flash-lite
    drafting: gemini-3.5-flash-lite
  effort: {extraction: medium, research: high, scoring: high, drafting: low}
  prices_usd_per_mtok:    # Anthropic first-party list prices (claude-api reference, cached 2026-11-03)
    claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
    claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_read: 0.01, cache_write: 0.125}
    # Gemini paid tier, Standard (ai.google.dev/gemini-api/docs/pricing, accessed 2026-11-21). Output includes thinking.
    # Search grounding: $14 per 1,000 search requests after 5,000 free a month (the free allowance is ignored here,
    # so the ledger overstates search cost until it is used up).
    # PRICE CHANGE: gemini-4-carbon doubles on 2026-12-01 (input 4.00, output 20.00, cache 0.20); 3.8-flash on 2027-01-01.
    gemini-4-carbon:       {input: 2.00, output: 10.00, cache_read: 0.10,  web_search_per_1k: 14.00}
    gemini-3.8-flash:      {input: 0.75, output: 3.75,  cache_read: 0.075, web_search_per_1k: 14.00}
    gemini-3.5-flash-lite: {input: 0.30, output: 2.50,  cache_read: 0.03,  web_search_per_1k: 14.00}
  web_search_usd_per_1k: 10.00     # Anthropic web search; Gemini models set their own above
  usd_inr: 88.0           # ASSUMPTION: placeholder rate, not sourced. Replace with the rate your card is billed at.
  spend_limits_inr_per_day: {alert: 1000, stop: 10000}   # user 2026-11-20 (lecture example figures)
  day_tz: Asia/Kolkata
roi:
  riya_inr_per_hour: 1000   # user 2026-11-20: PLACEHOLDER from the lecture; replace with Riya's real cost
  riya_minutes_per_application: 30   # case brief
  riya_days_per_quarter: 19          # case brief
  hours_per_day: 8                   # assumption (also in reports/run_metrics.json)
