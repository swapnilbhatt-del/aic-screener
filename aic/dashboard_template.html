<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIC Screener</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<style>
:root{color-scheme:light;
--bg:#f3f2ee;--surface:#ffffff;--surface2:#f8f7f3;--line:#e5e2da;--line2:#d6d2c7;--text:#16171a;--text2:#46474c;--muted:#76746c;
--accent:#1d5b47;--accent-ink:#ffffff;--accent-soft:#e3eee8;--link:#1b5a8c;--shadow:0 1px 2px rgba(20,20,15,.05),0 2px 8px rgba(20,20,15,.04);
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
--call:#137a3a;--call-bg:#e2f2e7;--review:#a86c0d;--review-bg:#fbf0d9;--hold:#b6501f;--hold-bg:#fbe6da;--pass:#b23535;--pass-bg:#f7e0e0;
--zone-pass:#f6e9e6;--zone-mid:#f8f1df;--zone-call:#e4f1e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#0f100f;--surface:#181917;--surface2:#1e1f1d;--line:#2c2d2a;--line2:#3a3b37;--text:#edece7;--text2:#c4c2b9;--muted:#8f8d84;
--accent:#6cc5a0;--accent-ink:#0f100f;--accent-soft:#1b2d26;--link:#8fbdec;--shadow:none;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
--call:#55c784;--call-bg:#16291d;--review:#e2b04a;--review-bg:#2c2412;--hold:#ee8c5f;--hold-bg:#2f1c13;--pass:#ee7070;--pass-bg:#311818;
--zone-pass:#2a1a18;--zone-mid:#2a2414;--zone-call:#16271c}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#0f100f;--surface:#181917;--surface2:#1e1f1d;--line:#2c2d2a;--line2:#3a3b37;--text:#edece7;--text2:#c4c2b9;--muted:#8f8d84;
--accent:#6cc5a0;--accent-ink:#0f100f;--accent-soft:#1b2d26;--link:#8fbdec;--shadow:none;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
--call:#55c784;--call-bg:#16291d;--review:#e2b04a;--review-bg:#2c2412;--hold:#ee8c5f;--hold-bg:#2f1c13;--pass:#ee7070;--pass-bg:#311818;
--zone-pass:#2a1a18;--zone-mid:#2a2414;--zone-call:#16271c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:ui-serif,"New York","Iowan Old Style",Charter,Georgia,"Times New Roman",serif}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;
 padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.04em;flex:0 0 auto}
.brand b{font-size:15px;display:block;line-height:1.2}.brand small{color:var(--muted);font-size:12px;display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.topbar .meta{color:var(--muted);font-size:12px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface2);text-decoration:none}
@media (max-width:760px){.topbar .meta{display:none}}
/* shell */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);gap:24px;max-width:1360px;margin:0 auto;
 padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:72px;align-self:start;max-height:calc(100vh - 88px);overflow:auto;padding-right:4px}
.side h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 8px 6px;font-weight:600}
.side h4:first-child{margin-top:0}
.navi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;color:var(--text)}
.navi:hover{background:var(--surface)}
.navi[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow);outline:1px solid var(--line)}
.navi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navi .sub{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;min-width:34px;text-align:center}
.p-call{background:var(--call-bg);color:var(--call)}.p-partner_review{background:var(--review-bg);color:var(--review)}
.p-hold{background:var(--hold-bg);color:var(--hold)}.p-pass{background:var(--pass-bg);color:var(--pass)}
.ico{width:16px;text-align:center;color:var(--muted);flex:0 0 auto}
#view{min-width:0}
@media (max-width:960px){.shell{grid-template-columns:minmax(0,1fr);gap:12px;padding-top:12px}
 .side{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:0 0 4px}
 .side h4{display:none}.navi{width:auto;flex:0 0 auto;background:var(--surface);outline:1px solid var(--line)}.navi .sub{display:none}}
/* page heading */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:4px 0 16px}
.pagehead h1{font-size:26px;line-height:1.15;margin:0;font-weight:600;letter-spacing:-.01em}
.pagehead p{margin:4px 0 0;color:var(--text2);max-width:72ch}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--text);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px}
.note b{color:var(--accent)}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);min-width:0}
.card>h2,section.card h2{font-size:15px;margin:0 0 4px;font-weight:600}
.card .lede{color:var(--muted);font-size:13px;margin:0 0 12px}
h3{font-size:13px;margin:18px 0 8px;color:var(--text2);font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.grid3 .card,.grid2 .card{margin-bottom:0}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:hover{border-color:var(--line2)}
.kpi[aria-pressed="true"]{outline:2px solid var(--text);outline-offset:-1px}
.kpi .k{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:28px;font-weight:600;line-height:1.1;margin-top:4px}
.kpi .h{font-size:11px;color:var(--muted)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,var(--line2))}
.k-call{--kc:var(--call)}.k-partner_review{--kc:var(--review)}.k-hold{--kc:var(--hold)}.k-pass{--kc:var(--pass)}.k-open{--kc:var(--accent)}
/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:0 12px}
.search input{border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:9px 0;width:100%}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--text2);white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--text);color:var(--surface)}
select.sel{background:var(--surface);color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
/* shortlist rows */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(200px,1fr) minmax(220px,1fr);gap:20px;align-items:center;background:var(--surface);
 border:1px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%}
.row:hover{border-color:var(--line2);transform:translateY(-1px)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row .rank{font-size:12px;color:var(--muted);margin-right:6px}
.row .name{font-size:16px;font-weight:600}
.row .one{color:var(--text2);font-size:13px;margin:2px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;border:1px solid var(--line);background:var(--surface2);color:var(--text2);border-radius:999px;padding:1px 8px;white-space:nowrap}
.chip.warn{border-color:transparent;background:var(--hold-bg);color:var(--hold)}
.chip.bad{border-color:transparent;background:var(--pass-bg);color:var(--pass)}
.chip.ok{border-color:transparent;background:var(--call-bg);color:var(--call)}
.chip.info{border-color:transparent;background:var(--review-bg);color:var(--review)}
.scorebox{display:flex;align-items:center;gap:14px}
.big{font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em}.big small{font-size:13px;color:var(--muted);font-weight:500}
.stack{position:relative;flex:1;height:10px;background:var(--surface2);border-radius:999px;outline:1px solid var(--line)}
.stack .seg2{position:absolute;top:0;bottom:0}
.stack .seg2:first-child{border-radius:999px 0 0 999px}
.stack .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.55;border-radius:1px}
.right{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.badge .i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:var(--surface)}
.b-call{background:var(--call-bg);color:var(--call)}.b-call .i{background:var(--call)}
.b-partner_review{background:var(--review-bg);color:var(--review)}.b-partner_review .i{background:var(--review)}
.b-hold{background:var(--hold-bg);color:var(--hold)}.b-hold .i{background:var(--hold)}
.b-pass{background:var(--pass-bg);color:var(--pass)}.b-pass .i{background:var(--pass)}
.decision{font-size:12px;color:var(--muted)}.decision b{color:var(--text)}
@media (max-width:900px){.row{grid-template-columns:minmax(0,1fr);gap:10px}}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:12px}
/* legend + chart */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin:4px 0 10px}.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart svg{display:block;width:100%;height:auto}.chartwrap{overflow-x:auto}
#tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.15);display:none;z-index:30}
/* company hero */
.crumbs{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.crumbs .path{font-size:13px;color:var(--muted)}.crumbs .path button{border:0;background:none;color:var(--link);cursor:pointer;padding:0}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:28px;align-items:center}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:34px;line-height:1.1;margin:2px 0 6px;font-weight:600;letter-spacing:-.015em}
.hero .one{color:var(--text2);font-size:15px;margin:0 0 12px;max-width:60ch}
.scorecol .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.scorecol .big{font-size:48px}
.track{position:relative;height:14px;border-radius:999px;overflow:visible;display:flex;margin:22px 0 6px}
.track .z{height:100%}.track .z:first-child{border-radius:999px 0 0 999px}.track .z:last-child{border-radius:0 999px 999px 0}
.track .marker{position:absolute;top:-7px;width:4px;height:28px;background:var(--text);border-radius:2px;transform:translateX(-2px)}
.track .mlabel{position:absolute;top:-24px;font-size:11px;font-weight:600;transform:translateX(-50%);white-space:nowrap}
.track .th{position:absolute;top:16px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:4px}
@media (max-width:760px){.groups{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gbar .l{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:4px}
.gbar .l b{color:var(--text)}
.gbar .b{height:8px;border-radius:999px;background:var(--surface2);outline:1px solid var(--line);overflow:hidden}
.gbar .b i{display:block;height:100%;border-radius:999px}
ul.clean{list-style:none;margin:0;padding:0}ul.clean li{padding:7px 0;border-top:1px solid var(--line);font-size:13px}ul.clean li:first-child{border-top:0;padding-top:0}
.flag{display:flex;gap:10px;align-items:flex-start}.flag .d{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:0 0 auto}
/* criteria */
.crit{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface)}
.crit .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crit .id{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.crit .t{font-weight:600;flex:1;min-width:160px}
.pips{display:inline-flex;gap:3px}.pips i{width:12px;height:12px;border-radius:3px;background:var(--surface2);outline:1px solid var(--line2)}
.pips i.on{background:var(--accent);outline-color:var(--accent)}
.crit .pts{font-size:13px;color:var(--text2);min-width:92px;text-align:right}
.crit .why{font-size:13px;color:var(--text2);margin:8px 0 0}
.adj{color:var(--hold);font-size:12px;margin-top:6px}
.past{font-size:12px;color:var(--text2);border-left:3px solid var(--s1);padding-left:8px;margin:6px 0}
details.ev{margin-top:8px}details.ev summary{cursor:pointer;font-size:12px;color:var(--link);list-style:none}
details.ev summary::-webkit-details-marker{display:none}details.ev summary::before{content:"\25B8  "}details.ev[open] summary::before{content:"\25BE  "}
.evl{margin-top:6px;border-left:2px solid var(--line2);padding-left:10px}
.evi{font-size:12px;color:var(--text2);margin:6px 0}.evi .q{color:var(--text);font-style:italic}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:var(--surface2);white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.small{font-size:12px}.muted{color:var(--muted)}
.st-FAIL,.st-hold{color:var(--pass);font-weight:600}.st-UNCHECKABLE{color:var(--muted);font-weight:600}.st-flag{color:var(--hold);font-weight:600}.st-clear{color:var(--call);font-weight:600}
.ev{margin:4px 0;font-size:13px;color:var(--text2)}
.tabs{margin:0 0 16px}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.st-done{background:var(--call-bg);color:var(--call)}.st-partial{background:var(--review-bg);color:var(--review)}.st-blocked{background:var(--pass-bg);color:var(--pass)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:16px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.qcard .qn{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.qcard .qq{font-size:15px;font-weight:600}.qcard .qt{font-size:12px;color:var(--text2)}.qcard .qe{font-size:13px;color:var(--text2);flex:1}
.quote{border-left:3px solid var(--accent);padding:6px 0 6px 14px;margin:0 0 16px;color:var(--text2);font-style:italic;font-size:15px;max-width:80ch}
.svgc svg{display:block;width:100%;height:auto}
</style></head>
<body>
<header class="topbar"><div class="brand"><div class="mark" aria-hidden="true">AIC</div><div><b>Screener</b><small>All In Capital · pre-seed inbound</small></div></div>
<div class="spacer"></div><span class="meta" id="meta"></span>
<a class="btn" href="https://github.com/swapnilbhatt-del/aic-screener" target="_blank" rel="noopener">Source on GitHub</a>
<!--theme--><button class="btn" id="theme" type="button" aria-label="Colour theme">Theme: auto</button><!--/theme--></header>
<div class="shell"><nav class="side" id="nav" aria-label="Sections"></nav><main id="view"></main></div>
<div id="tip" role="tooltip"></div>
<script type="application/json" id="data">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const BAND = {call:"Call", partner_review:"Partner review", hold:"Hold", pass:"Pass recommendation"};
const BAND_SHORT = {call:"Call", partner_review:"Review", hold:"Hold", pass:"Pass"};
const ICON = {call:"✓", partner_review:"!", hold:"‖", pass:"×"};
const ORDER = ["call","partner_review","hold","pass"];
const GROUPS = [["founder","Founder","--s1"],["path","Path","--s2"],["thesis","Thesis","--s3"],["structure","Structure","--s4"]];
const PAGES = [["learning","Feedback & fine-tuning","⇄"],["trust","Trust & limits","◎"],["gaps","What's missing","◌"],["time","Time & cost","◷"],["cost","AI cost & ROI","₹"]];
function el(tag, attrs, ...kids){const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs||{})){if(v==null)continue;if(k==="class")e.className=v;else if(k==="on")for(const [ev,f] of Object.entries(v))e.addEventListener(ev,f);else e.setAttribute(k,v);}for(const k of kids){if(k==null||k===false)continue;e.append(k instanceof Node?k:document.createTextNode(String(k)));}return e;}
function safeUrl(u){try{const x=new URL(u);return (x.protocol==="https:"||x.protocol==="http:")?x.href:null;}catch(e){return null;}}
function link(text, href, ext){if(!href)return document.createTextNode(text||"");const a=el("a",{href:href},text);if(ext){a.target="_blank";a.rel="noopener noreferrer";}return a;}
function badge(band){return el("span",{class:"badge b-"+band},el("span",{class:"i","aria-hidden":"true"},ICON[band]),BAND[band]);}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
